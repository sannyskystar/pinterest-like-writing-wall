<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Writing Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fdfbf7;color:#1e2421;font-family:"Instrument Sans","Noto Sans Bengali",system-ui,sans-serif;transition:.3s}
body.dark{background:#111413;color:#eae6df}
header{position:sticky;top:0;z-index:5;background:#fdfbf7e6;backdrop-filter:blur(12px);border-bottom:1px solid #eee8d8;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
body.dark header{background:#111413e6;border-color:#242825}
.logo{font-family:"Newsreader",serif;font-weight:600;font-size:24px;letter-spacing:-.03em}
.search-wrap{flex:1;max-width:760px;margin:0 12px}
.search-wrap input{width:100%;height:44px;border-radius:999px;border:1px solid #e9e0cf;background:#fff8ed;padding:0 18px;font-size:14px}
body.dark .search-wrap input{background:#1e2220;border-color:#2e3531;color:#eae6df}
.actions{display:flex;gap:8px}
.btn{height:36px;padding:0 14px;border-radius:999px;border:1px solid #e9e0cf;background:#fff;cursor:pointer;font-size:13px;font-weight:500}
body.dark .btn{background:#1e2220;border-color:#2e3531;color:#eae6df}
.grid{max-width:1280px;margin:0 auto;padding:18px 20px 80px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #eee6d5;border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}
body.dark .card{background:#1b1f1d;border-color:#242825}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.meta{padding:10px 12px}
.tags{font-size:11px;letter-spacing:.04em;color:#8a7f6e;line-height:1.4}
body.dark .tags{color:#9a9a8e}
.title{font-size:13px;font-weight:600;margin-top:4px;line-height:1.3;font-family:"Newsreader",serif}
.modal{position:fixed;inset:0;display:none;background:rgba(20,18,14,.55);backdrop-filter:blur(10px);z-index:30;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.box{background:#fffdf8;border-radius:22px;max-width:760px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 80px rgba(0,0,0,.25)}
body.dark .box{background:#191d1b}
.box img{width:100%;max-height:48vh;object-fit:cover;display:block}
.content{padding:22px 24px 24px}
.content h2{font-family:"Newsreader",serif;font-size:28px;margin:0 0 8px;line-height:1.15}
.content .date{font-size:12px;color:#9a8f7e;margin-bottom:12px}
.content .post{font-size:16px;line-height:1.7;white-space:normal}
.content .post b,.content .post strong{font-weight:700}
.content .post i,.content .post em{font-style:italic}
.content .post code{background:#f3eadd;padding:2px 6px;border-radius:6px;font-family:ui-monospace,monospace;font-size:14px}
body.dark .content .post code{background:#2a2e2b}
.content .post a{color:#c07a5f;text-decoration:underline}
.content .post ul{padding-left:20px}
.content .post li{margin:4px 0}
.kbd{font-size:11px;color:#aaa;margin-top:16px}
</style>
</head>
<body>
<header>
<div class="logo">The Writing Wall</div>
<div class="search-wrap"><input id="q" placeholder="Search keywords — writing, ideas, বাংলা..."></div>
<div class="actions"><button class="btn" id="theme">☾ Night</button></div>
</header>
<div class="grid" id="grid"></div>
<div class="modal" id="modal">
<div class="box">
<img id="mImg">
<div class="content">
<h2 id="mTitle"></h2>
<div class="date" id="mDate"></div>
<div class="tags" id="mTags" style="margin-bottom:14px"></div>
<div class="post" id="mPost"></div>
<div class="kbd">Press ESC or click outside to close</div>
</div>
</div>
</div>
<script>
// theme
const btn=document.getElementById('theme');
const saved=localStorage.getItem('ww-theme');
if(saved==='dark'){document.body.classList.add('dark');btn.textContent='☀ Day'}
btn.onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');localStorage.setItem('ww-theme',d?'dark':'light');btn.textContent=d?'☀ Day':'☾ Night'}

// markdown light parser + Bengali safe (UTF-8)
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(str){
  if(!str) return '';
  let s = escapeHtml(str);
  // code `code`
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  // bold **text** and __text__
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  // italic *text* and _text_ (avoid **)
  s = s.replace(/(^|[^*])\*([^*
]+)\*(?=[^*]|$)/g,'$1<em>$2</em>');
  s = s.replace(/(^|[^_])_([^_
]+)_(?=[^_]|$)/g,'$1<em>$2</em>');
  // links [text](url)
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // lists - lines starting with - or •
  // convert 
- to <li>
  // handle ul blocks
  let lines = s.split('
');
  let inUl=false, out=[];
  for(let line of lines){
    let m = line.match(/^\s*[-•]\s+(.*)/);
    if(m){
      if(!inUl){out.push('<ul>');inUl=true}
      out.push('<li>'+m[1]+'</li>');
    } else {
      if(inUl){out.push('</ul>');inUl=false}
      if(line.trim()===''){out.push('<br>')}
      else {out.push(line+'<br>')}
    }
  }
  if(inUl) out.push('</ul>');
  s = out.join('');
  return s;
}

let DATA=[];
async function load(){
  const grid=document.getElementById('grid');
  try{
    let res = await fetch('./data.json?v='+Date.now());
    if(!res.ok) res = await fetch('data.json');
    if(!res.ok) throw new Error('HTTP '+res.status);
    DATA = await res.json();
  }catch(e){
    try{
      let res2 = await fetch('./board-v5/data.json');
      if(res2.ok) DATA = await res2.json();
      else throw e;
    }catch(e2){
      grid.innerHTML = `<div style="grid-column:1/-1;padding:40px 20px;text-align:center;color:#c07a5f"><h3>data.json not found</h3><p style="font-size:14px;line-height:1.6">Make sure <b>data.json</b> is in the SAME folder as <b>index.html</b> in repo root.<br>You probably uploaded folder <code>board-v5/</code> — open it and upload the 3 files inside directly to root.<br><br>Error: ${e2.message}</p></div>`;
      console.error('data.json load failed', e2);
      return;
    }
  }
  DATA.sort((a,b)=> new Date(b.date)-new Date(a.date));
  render();
}
function render(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  const grid = document.getElementById('grid');
  const filtered = DATA.filter(d=>{
    if(!q) return true;
    const hay = (d.keywords.join(' ')+' '+d.title+' '+d.post).toLowerCase();
    return hay.includes(q);
  });
  grid.innerHTML = filtered.map(d=>`
    <div class="card" data-id="${d.id}">
      <img loading="lazy" src="${d.image}" alt="">
      <div class="meta">
        <div class="tags">${d.keywords.join(' • ')}</div>
        <div class="title">${escapeHtml(d.title)}</div>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.card').forEach(c=>{
    c.onclick=()=>openPost(c.dataset.id);
  });
}

function openPost(id){
  const d = DATA.find(x=>x.id===id);
  if(!d) return;
  document.getElementById('mImg').src=d.image;
  document.getElementById('mTitle').textContent=d.title;
  document.getElementById('mDate').textContent=d.date;
  document.getElementById('mTags').textContent=d.keywords.join(' • ');
  document.getElementById('mPost').innerHTML = md(d.post);
  document.getElementById('modal').classList.add('open');
}
document.getElementById('modal').addEventListener('click',e=>{
  if(e.target.id==='modal') e.currentTarget.classList.remove('open');
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') document.getElementById('modal').classList.remove('open');
});
document.getElementById('q').addEventListener('input',render);
load();
</script>
</body>
</html>
