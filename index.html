<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Board</title>
<style>:root{--bg:#fff;--muted:#6b6b6b;--border:#ececec;--radius:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px}.search-wrap{max-width:1100px;margin:0 auto;display:flex;gap:12px}.search-wrap input{flex:1;height:44px;border-radius:999px;border:1px solid var(--border);padding:0 18px 0 44px;background:#f5f5f5;outline:0;font-size:15px}main{max-width:1100px;margin:0 auto;padding:18px 16px 80px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.grid{grid-template-columns:1fr}}.card{cursor:pointer;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:#fff}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#f2f2f2}.card .meta{padding:8px 10px}.keywords{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal{position:fixed;inset:0;z-index:50;display:none}.modal.open{display:flex}.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}.modal-content{position:relative;margin:auto;max-width:720px;width:92%;max-height:88vh;overflow:auto;background:#fff;border-radius:18px}.modal-content img{width:100%;max-height:52vh;object-fit:cover}.modal-body{padding:20px 22px 28px}.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:999px;border:0;background:#fff;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.15)}.hint{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 0}</style></head><body>
<header><div class="search-wrap"><input id="search" placeholder="Search keywords like writing, tech, books..."></div></header>
<main><div class="grid" id="grid"></div><p class="hint">Newest posts first. Edit data.json to add more. Click image for post.</p></main>
<div class="modal" id="modal"><div class="backdrop" id="backdrop"></div><div class="modal-content"><button class="close" id="close">✕</button><img id="mImg"><div class="modal-body"><h2 id="mTitle"></h2><div id="mDate" style="font-size:12px;color:#777;margin-bottom:8px"></div><p id="mKeys" style="font-size:12px;color:#777"></p><p id="mPost" style="line-height:1.7"></p></div></div></div>
<script>
let DATA=[];async function load(){DATA=await fetch('./data.json').then(r=>r.json());DATA.sort((a,b)=>new Date(b.date)-new Date(a.date));render();}
function render(){const q=document.getElementById('search').value.toLowerCase().trim();const grid=document.getElementById('grid');let f=DATA.filter(d=>{if(!q)return true;return (d.keywords.join(' ')+' '+d.title).toLowerCase().includes(q);});if(f.length===0){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:#777">No results</div>';return;}grid.innerHTML=f.map(d=>`<div class="card" data-id="${d.id}"><img src="${d.image}" loading="lazy" onerror="this.src='https://via.placeholder.com/600'"><div class="meta"><div class="keywords">${d.keywords.join(' • ')}</div></div></div>`).join('');grid.querySelectorAll('.card').forEach(el=>el.onclick=()=>{const d=DATA.find(x=>x.id===el.dataset.id);document.getElementById('mImg').src=d.image;document.getElementById('mTitle').textContent=d.title;document.getElementById('mDate').textContent=d.date;document.getElementById('mKeys').textContent='# '+d.keywords.join(' #');document.getElementById('mPost').textContent=d.post;document.getElementById('modal').classList.add('open');});}
document.getElementById('search').addEventListener('input',render);document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('backdrop').onclick=()=>document.getElementById('modal').classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').classList.remove('open');});load();
</script></body></html>
